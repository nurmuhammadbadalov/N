<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyLand - Bog'lanish</title>
    <style>
        :root {
            --bg-color: #fff8f0;
            --text-color: #2c3e50;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --border-color: #ffe3d8;
            --shadow: 0 10px 20px rgba(255, 107, 107, 0.15);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #121824;
            --text-color: #f1f5f9;
            --nav-bg: #1e293b;
            --card-bg: #1e293b;
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --border-color: #334155;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: var(--transition);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .nav-links a.active {
            background-color: var(--primary-color);
            color: white;
        }

        .theme-toggle {
            background: var(--border-color);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
        }

        .container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .contact-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-group textarea {
            height: 140px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #ff5252;
        }

        footer {
            background-color: var(--nav-bg);
            border-top: 2px solid var(--border-color);
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 5rem;
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🧸 ToyLand</a>
            <ul class="nav-links">
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="products.html">O'yinchoqlar</a></li>
                <li><a href="categories.html">Kategoriyalar</a></li>
                <li><a href="about.html">Biz haqimizda</a></li>
                <li><a href="contact.html" class="active">Bog'lanish</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggleBtn">🌙</button>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Biz Bilan Bog'lanish</h1>
        <div class="contact-card">
            <form onsubmit="event.preventDefault(); alert('Buyurtmangiz muvaffaqiyatli qabul qilindi! Tez orada aloqaga chiqamiz.');">
                <div class="form-group">
                    <label for="name">Ismingiz</label>
                    <input type="text" id="name" required placeholder="Ismingizni kiriting">
                </div>
                <div class="form-group">
                    <label for="phone">Telefon raqamingiz</label>
                    <input type="tel" id="phone" required placeholder="+998 90 123 45 67">
                </div>
                <div class="form-group">
                    <label for="message">Xabar yoki Tanlangan O'yinchoq</label>
                    <textarea id="message" required placeholder="Qaysi o'yinchoqni sotib olmoqchisiz va manzilingiz..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Yuborish 🚀</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ToyLand O'yinchoqlar Magazini. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const body = document.body;
        const savedTheme = localStorage.getItem('toyLandTheme') || 'light';
        body.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('toyLandTheme', newTheme);
            themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
